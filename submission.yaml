what_we_are_most_proud_of: >
  The explainable root-cause engine: it ranks candidate sensors using
  several independent evidence sources and was validated on synthetic data
  with known injected causes (Top-1 0.953, Top-3 1.000). It is available
  both in a working dashboard and through an IBM Bob chatbot integration
  whose skill forbids inventing model outputs and requires labeling results
  as hypotheses that need engineering validation.

known_limitations: >
  WaferX's root-cause outputs are model-based hypotheses rather than confirmed
  physical causes because the SECOM dataset has no ground-truth causal labels.
  The process anomaly detector is an unsupervised Isolation Forest calibrated
  against the PASS training population, so anomaly evaluation is only a proxy.
  Wafer-image anomaly classification currently uses the classifier-derived
  anomaly score (1 - normal-class probability) with a 0.5 threshold, while
  the image Isolation Forest provides an additional detector score rather than
  being fused into the binary anomaly decision. The sample list uses demo
  sample
  IDs from the SECOM dataset, and what-if results are model-based
  counterfactuals that require engineering validation before any physical
  process change. The IBM Bob MCP configuration in .bob/mcp.json uses local
  Windows paths that must be edited for another machine.

