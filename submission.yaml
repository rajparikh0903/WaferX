submission:
  title: "Yeild Intelligence"

  problem_statement: >
    Semiconductor process engineers need to investigate potential causes of
    wafer or process failures across large numbers of equipment sensors and
    process parameters. Manual correlation of these signals can make defect
    investigation slow, while repeated defect patterns may not feed back into
    a systematic investigation and correction workflow.

  solution_summary: >
    WaferX is an AI-assisted semiconductor defect investigation workstation
    that combines failure-risk prediction, SHAP-based explanations, ranked
    root-cause candidates, supporting evidence, historical matches, and
    model-based what-if simulation. It helps process engineers move from
    detecting a potentially failing sample to investigating contributing
    parameters and evaluating possible parameter changes.

  key_features:
    - "Failure-risk prediction for semiconductor process samples"
    - "SHAP-based feature explanations and global feature importance"
    - "Ranked root-cause candidates using model contribution and supporting evidence"
    - "Historical evidence and counterfactual what-if investigation"
    - "AI Engineer Assistant that routes investigation questions to backend capabilities"

tech_stack:
  languages:
    - "Python"
    - "TypeScript"

  frameworks:
    - "FastAPI"
    - "Next.js 14"
    - "React"

  ibm_technologies:
    - "IBM Bob"

  databases:
    - "File-based storage (Parquet, CSV, joblib model artifacts) — no external database server"

  other:
    - "Tailwind CSS"
    - "Recharts"
    - "Lucide"
    - "SHAP"
    - "SECOM semiconductor dataset"

what_we_are_most_proud_of: >
  The explainable root-cause engine: it ranks candidate sensors using
  several independent evidence sources and was validated on synthetic data
  with known injected causes (Top-1 0.953, Top-3 1.000). We also unified
  process-sensor and wafer-image intelligence in a single analysis endpoint
  and a working dashboard.

known_limitations: >
  WaferX currently includes placeholder/mock functionality for the anomaly
  detection panel and defect-image classification because their real APIs are
  still under development. The sample list uses demo sample IDs, and what-if
  results are model-based counterfactuals that require engineering validation
  before any physical process change. 

