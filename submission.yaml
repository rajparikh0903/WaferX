submission:
  title: "Yield Intelligence"

  problem_statement: >
    Semiconductor process engineers need to investigate potential causes of
    wafer or process failures across large numbers of equipment sensors and
    process parameters. Manual correlation of these signals can make defect
    investigation slow, while repeated defect patterns may not feed back into
    a systematic investigation and correction workflow.

  solution_summary: >
    WaferX is an AI-assisted semiconductor defect investigation workstation
    that combines failure-risk prediction, SHAP-based explanations, ranked
    root-cause candidates, supporting evidence, historical matches,
    wafer-image classification and anomaly detection, and model-based what-if
    simulation. It helps process engineers move from detecting a potentially
    failing sample to investigating contributing parameters, identifying
    wafer-map defect patterns, and evaluating possible parameter changes.

  key_features:
    - "Failure-risk prediction with SHAP-based local and global feature explanations"
    - "Wafer-map defect classification using DINOv2 + ViT embeddings and trained MLP models, with image anomaly detection"
    - "Ranked root-cause candidates using model contribution, supporting evidence and historical matches"
    - "Constrained counterfactual what-if investigation of parameter changes"
    - "In-app AI Engineer Assistant that routes investigation questions to backend capabilities"
    - "IBM Bob chatbot integration: an MCP server and custom investigation skill let engineers run analysis, anomaly, root-cause, what-if and feature-importance queries by chatting with Bob"

